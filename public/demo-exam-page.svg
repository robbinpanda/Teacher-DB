    <text x="212" y="-5" font-family="Arial" font-size="17" fill="#222" stroke="none">a</text><text x="218" y="69" font-family="Arial" font-size="17" fill="#222" stroke="none">b</text>
  </g>
  <line x1="72" y1="543" x2="828" y2="543" stroke="#ece9e1"/>
  <text x="78" y="587" font-family="SimHei, sans-serif" font-size="17" font-weight="700">二、填空题（本大题共 6 小题，每小题 3 分）</text>
  <text x="78" y="633" font-family="SimSun, serif" font-size="18">3．若关于 x 的一元二次方程 x²−2x＋m＝0 有两个相等的</text>
  <text x="106" y="670" font-family="SimSun, serif" font-size="18">实数根，则 m＝________。</text>
  <line x1="72" y1="701" x2="828" y2="701" stroke="#ece9e1"/>
  <text x="78" y="746" font-family="SimHei, sans-serif" font-size="17" font-weight="700">三、解答题（请写出必要的计算或证明过程）</text>
  <text x="78" y="792" font-family="SimSun, serif" font-size="18">4．如图，在 △ABC 中，AB＝AC，点 D 在边 BC 上。</text>
  <text x="106" y="828" font-family="SimSun, serif" font-size="18">求证：∠BAD＝∠CAD。</text>
