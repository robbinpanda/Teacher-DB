  <line x1="82" y1="172" x2="818" y2="172" stroke="#202020" stroke-width="1.5"/>
  <text x="78" y="208" font-family="SimHei, sans-serif" font-size="17" font-weight="700">一、选择题（本大题共 10 小题，每小题 3 分）</text>
  <text x="78" y="254" font-family="SimSun, serif" font-size="18">1．计算 |−3|＋2² 的结果是（　　）</text>
  <text x="106" y="291" font-family="SimSun, serif" font-size="17">A．−1　　　　　 B．1　　　　　 C．5　　　　　 D．7</text>
  <line x1="72" y1="315" x2="828" y2="315" stroke="#ece9e1"/>
  <text x="78" y="356" font-family="SimSun, serif" font-size="18">2．如图，直线 a∥b，∠1＝56°，则 ∠2 的度数为（　　）</text>
  <text x="106" y="399" font-family="SimSun, serif" font-size="17">A．34°　　　 B．56°　　　 C．124°　　　 D．134°</text>
  <g transform="translate(540 392)" stroke="#222" fill="none" stroke-width="3">
    <line x1="0" y1="20" x2="225" y2="0"/><line x1="4" y1="93" x2="229" y2="73"/><line x1="76" y1="-18" x2="151" y2="126"/>
    <path d="M89 13 A28 28 0 0 1 105 40" stroke="#555" stroke-width="2"/><path d="M118 79 A28 28 0 0 1 133 105" stroke="#555" stroke-width="2"/>
