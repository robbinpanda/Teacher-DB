  <text x="450" y="78" text-anchor="middle" font-family="SimSun, serif" font-size="18" fill="#333">2025 届九年级第二次模拟考试</text>
  <text x="450" y="119" text-anchor="middle" font-family="SimHei, sans-serif" font-size="31" font-weight="700" fill="#111">数 学 试 题</text>
